name: CI

# Otomatik tetikleyiciler kapalı: GitHub Actions hesabında bir sorun çözülene kadar
# CI yalnızca Actions sekmesinden elle çalıştırılır. Geri açmak için push ve
# pull_request tetikleyicilerini yeniden ekleyin.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
