<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E53935"/>
      <stop offset="1" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- chip pins -->
  <g fill="#FFFFFF">
    <rect x="352" y="214" width="36" height="78" rx="10"/>
    <rect x="452" y="214" width="36" height="78" rx="10"/>
    <rect x="552" y="214" width="36" height="78" rx="10"/>
    <rect x="652" y="214" width="36" height="78" rx="10"/>
    <rect x="352" y="732" width="36" height="78" rx="10"/>
    <rect x="452" y="732" width="36" height="78" rx="10"/>
    <rect x="552" y="732" width="36" height="78" rx="10"/>
    <rect x="652" y="732" width="36" height="78" rx="10"/>
    <rect x="214" y="352" width="78" height="36" rx="10"/>
    <rect x="214" y="452" width="78" height="36" rx="10"/>
    <rect x="214" y="552" width="78" height="36" rx="10"/>
    <rect x="214" y="652" width="78" height="36" rx="10"/>
    <rect x="732" y="352" width="78" height="36" rx="10"/>
    <rect x="732" y="452" width="78" height="36" rx="10"/>
    <rect x="732" y="552" width="78" height="36" rx="10"/>
    <rect x="732" y="652" width="78" height="36" rx="10"/>
  </g>
  <!-- chip body -->
  <rect x="282" y="282" width="460" height="460" rx="48" fill="#FFFFFF"/>
  <rect x="322" y="322" width="380" height="380" rx="28" fill="none" stroke="#C62828" stroke-width="14"/>
  <!-- clock / square wave across the die -->
  <polyline points="350,590 410,590 410,450 500,450 500,590 590,590 590,450 674,450"
            fill="none" stroke="#C62828" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pin-1 marker -->
  <circle cx="362" cy="362" r="16" fill="#C62828"/>
</svg>
